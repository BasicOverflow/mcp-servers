services:
  metrics-mcp:
    build: .
    container_name: metrics-mcp
    restart: unless-stopped
    ports:
      - "8084:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      # Same LAN IP works from the container on this host
      PROMETHEUS_URL: "${PROMETHEUS_URL:-http://10.0.121.218:9090}"
      MCP_ALLOWED_HOSTS: "10.0.121.218,10.0.121.218:*,127.0.0.1,127.0.0.1:*,localhost,localhost:*"
      MCP_ALLOWED_ORIGINS: "http://10.0.121.218:*,http://127.0.0.1:*,http://localhost:*"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
