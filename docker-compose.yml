services:
  notes-mcp-server:
    build: .
    container_name: notes-mcp-server
    ports:
      - "8000:8000"
    volumes:
      - ./vault:/app/vault:rw
    environment:
      - VAULT_PATH=${VAULT_PATH:-/app/vault}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
    restart: unless-stopped

