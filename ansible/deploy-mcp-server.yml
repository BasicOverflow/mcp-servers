---
- name: Pull Git Changes and Restart Docker Compose
  hosts: insights-host
  become: yes
  become_user: peter
  vars:
    repo_url: "{{ GITHUB_REPO_URL }}"
    branch: "{{ GITHUB_BRANCH }}"
    deploy_dir: "{{ DEPLOY_DIR }}"

  tasks:
    - name: Configure Git safe directory
      shell: git config --global --add safe.directory "{{ deploy_dir }}"
      changed_when: false

    - name: Get current commit hash
      shell: git rev-parse HEAD
      args:
        chdir: "{{ deploy_dir }}"
      register: commit_before
      changed_when: false
      ignore_errors: true

    - name: Pull latest changes from Git
      git:
        repo: "{{ repo_url }}"
        dest: "{{ deploy_dir }}"
        version: "{{ branch }}"
        update: yes

    - name: Get commit hash after pull
      shell: git rev-parse HEAD
      args:
        chdir: "{{ deploy_dir }}"
      register: commit_after
      changed_when: false

    - name: Restart Docker Compose if changes detected
      when: commit_before.stdout != commit_after.stdout
      shell: docker compose restart
      args:
        chdir: "{{ deploy_dir }}"

    - name: Restart Docker Compose if no previous commit (first run)
      when: commit_before.stdout == "" or commit_before.rc != 0
      shell: docker compose restart
      args:
        chdir: "{{ deploy_dir }}"

