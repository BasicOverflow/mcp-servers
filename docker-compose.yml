services:
  metrics-mcp:
    build: .
    container_name: metrics-mcp
    restart: unless-stopped
    ports:
      - "8084:8000"
    environment:
      HOST: "0.0.0.0"
      PORT: "8000"
      PROMETHEUS_URL: "${PROMETHEUS_URL:-http://host.docker.internal:9090}"
      MCP_ALLOWED_HOSTS: "${MCP_ALLOWED_HOSTS:-127.0.0.1,127.0.0.1:*,localhost,localhost:*}"
      MCP_ALLOWED_ORIGINS: "${MCP_ALLOWED_ORIGINS:-http://127.0.0.1:*,http://localhost:*}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
